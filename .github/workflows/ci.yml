# Continuous integration: every push and pull request runs all test levels and publishes the evidence
# (test results, coverage, Playwright traces and screenshots) as artifacts.
name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NODE_VERSION: "24"

jobs:
  backend:
    name: Backend (build, unit, integration, contract)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore
      - name: Build (warnings are errors)
        run: dotnet build --no-restore -c Release -p:TreatWarningsAsErrors=true
      - name: Formatting (dotnet format)
        run: dotnet format --no-restore --verify-no-changes

      - name: Unit tests
        run: >
          dotnet test tests/AssetDashboard.Tests --no-build -c Release
          --logger "trx;LogFileName=unit.trx" --collect:"XPlat Code Coverage" --results-directory TestResults/unit
      - name: Integration tests (Testcontainers PostgreSQL, API contract, API docs)
        run: >
          dotnet test tests/AssetDashboard.IntegrationTests --no-build -c Release
          --logger "trx;LogFileName=integration.trx" --collect:"XPlat Code Coverage" --results-directory TestResults/integration

      - name: Vulnerable packages
        run: |
          dotnet list package --vulnerable --include-transitive 2>&1 | tee vulnerable.txt
          ! grep -q -i "has the following vulnerable packages" vulnerable.txt

      - name: Coverage report
        if: always()
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool
          reportgenerator -reports:"TestResults/**/coverage.cobertura.xml" -targetdir:coverage -reporttypes:"Html;MarkdownSummaryGithub" || true
          cat coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: |
            TestResults/**/*.trx
            coverage/
          if-no-files-found: ignore

  frontend:
    name: Frontend (format, contract types, unit tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - name: Formatting (Prettier)
        run: npm run format:check
      - name: Generated API types match the contract
        run: npm run api:check
      - name: Unit tests with coverage (Vitest)
        run: npm run test:ci
      - name: Production build
        run: npx ng build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: web/coverage/
          if-no-files-found: ignore

  e2e:
    name: End-to-end (Aspire + Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci
        working-directory: web
      - name: Build tests
        run: dotnet build tests/AssetDashboard.EndToEndTests -c Release
      - name: Install Chromium and its system libraries
        run: pwsh tests/AssetDashboard.EndToEndTests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: End-to-end tests
        run: >
          dotnet test tests/AssetDashboard.EndToEndTests --no-build -c Release
          --logger "trx;LogFileName=e2e.trx" --results-directory TestResults/e2e
      - name: Summary (latency and accessibility)
        if: always()
        run: |
          dir=$(find tests/AssetDashboard.EndToEndTests/bin/Release/net10.0/e2e-artifacts -mindepth 1 -maxdepth 1 -type d | sort | tail -1)
          [ -n "$dir" ] || exit 0
          { echo "### End-to-end"; echo '```'; cat "$dir/latency.txt" 2>/dev/null; grep violations "$dir/accessibility.txt" 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-artifacts
          path: |
            TestResults/e2e/*.trx
            tests/AssetDashboard.EndToEndTests/bin/Release/net10.0/e2e-artifacts/
          if-no-files-found: ignore
