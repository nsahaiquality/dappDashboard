# Local development infrastructure.
#   docker compose up -d            → Postgres only
#   docker compose --profile tools up -d   → Postgres + pgAdmin (http://localhost:5050)
services:
  postgres:
    image: postgres:17-alpine
    container_name: assetdash-postgres
    environment:
      POSTGRES_DB: assetdashboard
      POSTGRES_USER: assetdash
      POSTGRES_PASSWORD: assetdash   # local development only
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assetdash -d assetdashboard"]
      interval: 5s
      timeout: 3s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:9
    profiles: ["tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: dev@example.com
      PGADMIN_DEFAULT_PASSWORD: dev
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  pgdata:
