<div class="shell">
  <nav class="sidebar" aria-label="Main">
    <a class="brand" routerLink="/">
      <span class="brand-mark"><app-icon name="logo" [stroke]="2" /></span>
      <span class="brand-text">
        <span class="brand-name">Asset Portfolio</span>
        <span class="brand-sub">Equipment finance</span>
      </span>
    </a>

    <div class="nav-group">
      <span class="nav-heading">Monitor</span>
      @for (item of monitor; track item.label) {
        @if (item.link) {
          <a class="nav-item" [routerLink]="item.link" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" ariaCurrentWhenActive="page">
            <app-icon [name]="item.icon" />{{ item.label }}
          </a>
        } @else {
          <span class="nav-item disabled" aria-disabled="true">
            <app-icon [name]="item.icon" />{{ item.label }}<span class="soon">Planned</span>
          </span>
        }
      }
    </div>

    <div class="nav-group">
      <span class="nav-heading">Data</span>
      @for (item of data; track item.label) {
        <span class="nav-item disabled" aria-disabled="true">
          <app-icon [name]="item.icon" />{{ item.label }}<span class="soon">Planned</span>
        </span>
      }
    </div>

    <div class="sidebar-note">
      <span class="sidebar-note-title">Synthetic dataset</span>
      <span>Training exercise. Not affiliated with any company.</span>
    </div>
  </nav>

  <main class="content">
    <router-outlet />
  </main>
</div>
